<div class="login-container" style="max-width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Iniciar Sesión</h2>
  
  <form [formGroup]="formLogin" (ngSubmit)="pruebaLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block;">Usuario:</label>
      <input type="text" formControlName="email" style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block;">Contraseña:</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" [disabled]="formLogin.invalid" style="width: 100%; padding: 10px; background: blue; color: white; border: none; cursor: pointer;">
      Ingresar
    </button>
  </form>
</div>
