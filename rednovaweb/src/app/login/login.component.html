<div class="login-panel">
  <div class="panel-header">
    <h2>Iniciar Sesión</h2>
    <span class="endpoint-tag">¡Bienvenidos a RedNova!</span>
  </div>

  <div class="panel-body">
    <form [formGroup]="formLogin" (ngSubmit)="pruebaLogin()">
      
      <div class="field">
        <label>Usuario (Email):</label>
        <input type="text" formControlName="email" placeholder="tuemail@mail.com">
      </div>

      <div class="field">
        <label>Contraseña:</label>
        <input type="password" formControlName="password" placeholder="Ingresa tu contraseña">
      </div>

      <div class="divider"></div>

      <button type="submit" class="btn btn-primary" [disabled]="formLogin.invalid">
        Ingresar →
      </button>

    </form>
  </div>
</div>
